<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Slider</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 50px;
    }
    .slider {
      width: 400px;
      height: 250px;
      overflow: hidden;
      border-radius: 10px;
      position: relative;
    }
    .slides {
      display: flex;
      width: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .slide {
      min-width: 100%;
      height: 250px;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .buttons {
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Upcoming Events</h2>
  <div class="slider">
    <div class="slides" id="slides">
      <div class="slide"><img src="./Assets/Images/2.jpg" alt="Event 1"></div>
      <div class="slide"><img src="./Assets/Images/3.jpg" alt="Event 2"></div>
      <div class="slide"><img src="./Assets/Images/4.jpg" alt="Event 3"></div>
    </div>
  </div>

  <div class="buttons">
    <button onclick="prevSlide()">Previous</button>
    <button onclick="nextSlide()">Next</button>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const totalSlides = slides.children.length;
    let index = 0;

    function showSlide(i) {
      index = (i + totalSlides) % totalSlides; // wrap around
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    function nextSlide() {
      showSlide(index + 1);
    }

    function prevSlide() {
      showSlide(index - 1);
    }

    // Auto slide every 3 seconds
    setInterval(nextSlide, 3000);
  </script>

</body>
</html>
